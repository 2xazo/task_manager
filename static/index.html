<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager - Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            color: #667eea;
            font-size: 28px;
        }

        header .status {
            background: #10b981;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 20px;
        }

        .card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            font-family: inherit;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        button {
            background: #667eea;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.3s;
            width: 100%;
        }

        button:hover {
            background: #764ba2;
        }

        button.delete {
            background: #ef4444;
            padding: 8px 12px;
            width: auto;
            font-size: 12px;
            margin-top: 5px;
        }

        button.delete:hover {
            background: #dc2626;
        }

        .list-section {
            margin-top: 30px;
        }

        .list-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
        }

        .list-item h3 {
            color: #333;
            margin-bottom: 5px;
        }

        .list-item p {
            color: #666;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 12px;
            font-weight: bold;
            margin-right: 5px;
        }

        .badge.high {
            background: #fee2e2;
            color: #991b1b;
        }

        .badge.medium {
            background: #fef3c7;
            color: #92400e;
        }

        .badge.low {
            background: #dcfce7;
            color: #166534;
        }

        .badge.todo {
            background: #dbeafe;
            color: #0c4a6e;
        }

        .badge.in_progress {
            background: #fef3c7;
            color: #92400e;
        }

        .badge.done {
            background: #dcfce7;
            color: #166534;
        }

        .badge.admin {
            background: #fce7f3;
            color: #831843;
        }

        .badge.manager {
            background: #ede9fe;
            color: #4c1d95;
        }

        .badge.member {
            background: #dbeafe;
            color: #0c4a6e;
        }

        .empty-message {
            color: #999;
            text-align: center;
            padding: 30px;
            font-style: italic;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            display: none;
        }

        .success {
            background: #dcfce7;
            color: #166534;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            display: none;
        }

        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📋 Task Manager</h1>
            <div class="status" id="status">✓ Connected</div>
        </header>

        <div class="main-grid">
            <!-- Create Task Section -->
            <div class="card">
                <h2>➕ Create Task</h2>
                <div class="error" id="taskError"></div>
                <div class="success" id="taskSuccess"></div>
                <form id="taskForm">
                    <div class="form-group">
                        <label>Title *</label>
                        <input type="text" id="taskTitle" placeholder="Enter task title" required>
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea id="taskDesc" placeholder="Enter task description"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Priority *</label>
                        <select id="taskPriority" required>
                            <option value="">Select priority</option>
                            <option value="low">Low</option>
                            <option value="medium">Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Assigned To</label>
                        <input type="text" id="taskAssigned" placeholder="Username">
                    </div>
                    <button type="submit">Create Task</button>
                </form>
            </div>

            <!-- Create User Section -->
            <div class="card">
                <h2>👤 Create User</h2>
                <div class="error" id="userError"></div>
                <div class="success" id="userSuccess"></div>
                <form id="userForm">
                    <div class="form-group">
                        <label>Username *</label>
                        <input type="text" id="userName" placeholder="Enter username" required>
                    </div>
                    <div class="form-group">
                        <label>Full Name *</label>
                        <input type="text" id="userFullName" placeholder="Enter full name" required>
                    </div>
                    <div class="form-group">
                        <label>Email *</label>
                        <input type="email" id="userEmail" placeholder="Enter email" required>
                    </div>
                    <div class="form-group">
                        <label>Phone</label>
                        <input type="tel" id="userPhone" placeholder="Enter phone number">
                    </div>
                    <div class="form-group">
                        <label>Role *</label>
                        <select id="userRole" required>
                            <option value="">Select role</option>
                            <option value="admin">Admin</option>
                            <option value="manager">Manager</option>
                            <option value="member">Member</option>
                        </select>
                    </div>
                    <button type="submit">Create User</button>
                </form>
            </div>
        </div>

        <!-- Tasks List Section -->
        <div class="card list-section">
            <h2>📝 All Tasks</h2>
            <div id="tasksList" class="empty-message">Loading tasks...</div>
        </div>

        <!-- Users List Section -->
        <div class="card list-section">
            <h2>👥 All Users</h2>
            <div id="usersList" class="empty-message">Loading users...</div>
        </div>
    </div>

    <script>
        const API_URL = 'http://127.0.0.1:8000';

        // Load tasks
        async function loadTasks() {
            try {
                const response = await fetch(`${API_URL}/tasks`);
                const tasks = await response.json();
                
                const tasksList = document.getElementById('tasksList');
                if (tasks.length === 0) {
                    tasksList.innerHTML = '<div class="empty-message">No tasks yet. Create one!</div>';
                    return;
                }
                
                tasksList.innerHTML = tasks.map(task => `
                    <div class="list-item">
                        <h3>${task.title}</h3>
                        <p>${task.description || 'No description'}</p>
                        <div>
                            <span class="badge ${task.priority}">${task.priority}</span>
                            <span class="badge ${task.status}">${task.status}</span>
                            ${task.assigned_to ? `<span class="badge">👤 ${task.assigned_to}</span>` : ''}
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                document.getElementById('tasksList').innerHTML = '<div class="empty-message">Error loading tasks</div>';
            }
        }

        // Load users
        async function loadUsers() {
            try {
                const response = await fetch(`${API_URL}/users`);
                const users = await response.json();
                
                const usersList = document.getElementById('usersList');
                if (users.length === 0) {
                    usersList.innerHTML = '<div class="empty-message">No users yet. Create one!</div>';
                    return;
                }
                
                usersList.innerHTML = users.map(user => `
                    <div class="list-item">
                        <h3>${user.username}</h3>
                        <p><strong>${user.profile.full_name}</strong></p>
                        <p>📧 ${user.profile.email}</p>
                        ${user.profile.phone ? `<p>📱 ${user.profile.phone}</p>` : ''}
                        <div>
                            <span class="badge ${user.role}">${user.role}</span>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                document.getElementById('usersList').innerHTML = '<div class="empty-message">Error loading users</div>';
            }
        }

        // Check API status
        async function checkStatus() {
            try {
                const response = await fetch(`${API_URL}/health`);
                if (response.ok) {
                    document.getElementById('status').innerHTML = '✓ Connected';
                    document.getElementById('status').style.background = '#10b981';
                } else {
                    document.getElementById('status').innerHTML = '✗ Disconnected';
                    document.getElementById('status').style.background = '#ef4444';
                }
            } catch (error) {
                document.getElementById('status').innerHTML = '✗ Disconnected';
                document.getElementById('status').style.background = '#ef4444';
            }
        }

        // Create task
        document.getElementById('taskForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const taskData = {
                title: document.getElementById('taskTitle').value,
                description: document.getElementById('taskDesc').value,
                priority: document.getElementById('taskPriority').value,
                assigned_to: document.getElementById('taskAssigned').value || null,
                status: 'todo'
            };

            try {
                const response = await fetch(`${API_URL}/tasks`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(taskData)
                });

                if (response.ok) {
                    showMessage('taskSuccess', 'Task created successfully!');
                    document.getElementById('taskForm').reset();
                    loadTasks();
                } else {
                    showMessage('taskError', 'Error creating task');
                }
            } catch (error) {
                showMessage('taskError', 'Error: ' + error.message);
            }
        });

        // Create user
        document.getElementById('userForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const userData = {
                username: document.getElementById('userName').value,
                role: document.getElementById('userRole').value,
                profile: {
                    full_name: document.getElementById('userFullName').value,
                    email: document.getElementById('userEmail').value,
                    phone: document.getElementById('userPhone').value || null
                }
            };

            try {
                const response = await fetch(`${API_URL}/users`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(userData)
                });

                if (response.ok) {
                    showMessage('userSuccess', 'User created successfully!');
                    document.getElementById('userForm').reset();
                    loadUsers();
                } else {
                    const error = await response.json();
                    showMessage('userError', 'Error: ' + JSON.stringify(error));
                }
            } catch (error) {
                showMessage('userError', 'Error: ' + error.message);
            }
        });

        function showMessage(elementId, message) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.style.display = 'block';
            setTimeout(() => {
                element.style.display = 'none';
            }, 3000);
        }

        // Initialize
        checkStatus();
        loadTasks();
        loadUsers();

        // Refresh every 5 seconds
        setInterval(checkStatus, 5000);
        setInterval(loadTasks, 10000);
        setInterval(loadUsers, 10000);
    </script>
</body>
</html>
